<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drafts</title>
<style>
  :root {
    --ink: oklch(0.22 0.012 80);
    --paper: oklch(0.985 0.005 80);
    --rule: oklch(0.88 0.01 80);
    --clay: oklch(0.58 0.13 45);
    --radius: 3px;
  }
  body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.5;
         font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
         padding: clamp(1rem, 0.5rem + 2.5vw, 3rem); }
  main { width: min(100%, 40rem); margin: 0 auto; }
  h1 { font-size: clamp(1.5rem, 1.2rem + 1.5vw, 2.25rem); letter-spacing: -0.02em; margin: 0 0 1rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.5rem 0; border-top: 1px solid var(--rule); }
  .when { color: oklch(0.5 0.015 80); font-variant-numeric: tabular-nums; }
  button.remove { display: inline-grid; place-items: center; inline-size: 2.75rem; block-size: 2.75rem; padding: 0;
                  font: inherit; color: var(--clay); background: transparent; border: 1px solid var(--rule); border-radius: var(--radius); }
  button.remove svg { inline-size: 1.125rem; block-size: 1.125rem; }
  button.remove:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <h1>Unsent drafts</h1>
    <ul>
      <li>
        <span>Re: bench slot for the tenor sax</span>
        <span class="when">Yesterday, 17:20</span>
        <button class="remove" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg></button>
      </li>
    </ul>
  </main>
</body>
</html>
