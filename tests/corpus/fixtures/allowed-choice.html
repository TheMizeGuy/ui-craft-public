<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger</title>
<style>
  :root {
    --ink: oklch(0.22 0.02 60);
    --paper: oklch(0.98 0.004 90);
    --terra: oklch(0.55 0.15 25);
  }
  body { background: var(--paper); color: var(--ink); margin: 0; line-height: 1.5;
         font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
         padding: clamp(1.25rem, 0.75rem + 2.5vw, 3rem); }
  main { width: min(100%, 62ch); margin: 0 auto; }
  h1 { font-size: clamp(2rem, 1rem + 5vw, 4.5rem); letter-spacing: -0.025em; font-weight: 500; margin: 0 0 1rem; }
  .accent { background: linear-gradient(90deg, oklch(0.62 0.15 25), oklch(0.72 0.16 60)); background-clip: text; -webkit-background-clip: text; color: transparent; } /* anti-slop-allow: the wordmark gradient from the 2024 identity guide, used on the one brand word only */
  p { font-size: 1.0625rem; color: oklch(0.4 0.02 60); max-width: 58ch; }
  a.cta { color: var(--terra); text-decoration: underline; text-underline-offset: 3px; }
  a.cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <h1>Every entry, <span class="accent">reconciled</span> to the cent.</h1>
    <p>Ledger closes the books on the last day of the month, not the tenth of the next one. Import from three banks, match against invoices, and export a filed return.</p>
    <a class="cta" href="/start">See a closed month</a>
  </main>
</body>
</html>
