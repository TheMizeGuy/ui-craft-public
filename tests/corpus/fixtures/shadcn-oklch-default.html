<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seats</title>
<style>
  :root {
    --radius: 0.625rem;
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
  }
  body { margin: 0; background: var(--background); color: var(--foreground); line-height: 1.5;
         font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
         padding: clamp(1rem, 0.5rem + 2vw, 2.5rem); }
  main { width: min(100%, 40rem); margin: 0 auto; }
  h1 { font-size: clamp(1.25rem, 1.1rem + 0.8vw, 1.75rem); letter-spacing: -0.02em; margin: 0 0 1rem; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 0.25rem; }
  p { margin: 0; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  a { color: var(--primary); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <h1>Workspace seats</h1>
    <div class="rounded-xl border bg-card text-card-foreground shadow-sm p-6">
      <h2>Plan usage</h2>
      <p>You have used 42 of 100 seats this month.</p>
    </div>
    <p><a href="/billing/seats">Manage seats</a></p>
  </main>
</body>
</html>
